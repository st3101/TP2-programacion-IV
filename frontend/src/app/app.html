<router-outlet />
@if (authService.segundosRestantesSesion() !== null) {
  <div class="session-countdown" role="timer" aria-label="Tiempo restante de sesión">
    <span class="session-countdown-dot" aria-hidden="true"></span>
    <span class="session-countdown-label">Sesión</span>
    <strong>{{ textoRelojSesion() }}</strong>
  </div>
}
@if (authService.avisoExtensionSesion()) {
  <div class="session-modal-backdrop">
    <section class="session-modal" role="alertdialog" aria-modal="true" aria-labelledby="session-modal-title">
      <h2 id="session-modal-title">La sesión se está por expirar</h2>
      <p>Quedan {{ authService.segundosRestantesSesion() }} segundos. ¿Querés extenderla?</p>
      <div class="session-modal-actions">
        <button type="button" class="session-modal-cancel" (click)="finalizarSesion()">Cerrar</button>
        <button type="button" class="session-modal-extend" (click)="extenderSesion()">Extender sesión</button>
      </div>
    </section>
  </div>
}
